# One-click Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nichefinder-os
    runtime: docker
    plan: starter          # has a persistent disk; free tier loses the wallet store on restart
    healthCheckPath: /v1/health
    disk:
      name: nf-data
      mountPath: /app/backend/gateway/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # paste in dashboard — never in the repo
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: WALLET_STORE_KEY
        generateValue: true  # 32-byte hex is required; regenerate as 64 hex chars if needed
      - key: ADMIN_API_KEY
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false        # e.g. https://app.nichefinderhq.com
