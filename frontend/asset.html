<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Finder — Generated Asset</title>
<meta name="description" content="Investor-grade generated asset: validation report, financial forecast, business plan, or pitch deck.">
<meta name="theme-color" content="#070B14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Niche Finder">
<style>
  :root{
    --ink:#070B14;
    --panel:#0E1626;
    --panel-2:#121C30;
    --line:rgba(232,166,26,.14);
    --line-soft:rgba(139,147,165,.14);
    --text:#EAE5D9;
    --muted:#8B93A5;
    --gold:#E8A61A;
    --gold-bright:#FFC53D;
    /* document palette (light surface) */
    --paper:#FDFBF6;
    --paper-2:#F4EFE4;
    --doc-ink:#1C2233;
    --doc-muted:#5D6575;
    --doc-line:#E4DCC9;
    --brand:#B8861F;
    --teal:#1F7A6F;
    --coral:#C4604F;
    --violet:#6B5CA5;
    --blue:#2E6FA3;
    --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--gold);color:var(--ink)}
  a{color:inherit}
  a:focus-visible,button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;border-radius:2px}
  .wrap{max-width:1060px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}

  header.nav{position:fixed;inset:0 0 auto 0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(7,11,20,.72);border-bottom:1px solid var(--line-soft)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand-mark{width:26px;height:26px;flex:none;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center}
  .brand-mark i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:block}
  .brand span{font-family:var(--serif);font-size:1.05rem}
  .brand em{font-style:normal;color:var(--gold)}
  .nav-right{display:flex;gap:10px;align-items:center}
  .nav-btn{cursor:pointer;font-size:.78rem;font-weight:600;color:var(--text);background:none;border:1px solid var(--line-soft);border-radius:5px;padding:8px 15px;text-decoration:none;font-family:var(--sans)}
  .nav-btn:hover{border-color:var(--gold)}
  .nav-btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}

  main{padding:92px 0 90px}

  /* ---------- document shell ---------- */
  .doc{
    background:var(--paper);color:var(--doc-ink);border-radius:12px;overflow:hidden;
    box-shadow:0 40px 90px -28px rgba(0,0,0,.8);
  }
  .doc-band{
    background:linear-gradient(120deg,#0E1626 0%,#1A2440 55%,#2A2210 100%);
    color:var(--text);padding:38px 44px 34px;position:relative;overflow:hidden;
  }
  .doc-band::after{
    content:"";position:absolute;right:-60px;top:-70px;width:280px;height:280px;border-radius:50%;
    border:1.5px solid rgba(232,166,26,.35);
  }
  .doc-band::before{
    content:"";position:absolute;right:20px;top:30px;width:170px;height:170px;border-radius:50%;
    border:1px solid rgba(232,166,26,.2);
  }
  .doc-brandline{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.62rem;letter-spacing:.26em;color:var(--gold-bright)}
  .doc-brandline i{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block}
  .doc-band h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,3.4vw,2.4rem);margin-top:14px;line-height:1.15;max-width:24ch;position:relative;z-index:1}
  .doc-band .sub{margin-top:10px;color:#B9C0CE;font-size:.9rem;max-width:60ch}
  .doc-band .meta{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:22px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#8B93A5}
  .doc-band .meta b{color:var(--gold-bright);font-weight:600}

  .doc-body{padding:14px 44px 48px}
  @media(max-width:640px){.doc-band{padding:28px 22px}.doc-body{padding:10px 22px 34px}}

  .sec{margin-top:38px}
  .sec-head{display:flex;align-items:baseline;gap:14px}
  .sec-head .n{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;color:var(--brand)}
  .sec-head h2{font-family:var(--serif);font-weight:400;font-size:1.35rem;color:var(--doc-ink)}
  .sec-head::after{content:"";height:1px;background:var(--doc-line);flex:1;align-self:center}
  .sec p{color:var(--doc-muted);font-size:.9rem;margin-top:12px;max-width:76ch}
  .sec p b{color:var(--doc-ink)}

  .callout{
    display:flex;gap:18px;align-items:center;margin-top:18px;border-radius:10px;padding:20px 24px;
    background:linear-gradient(100deg,rgba(184,134,31,.1),rgba(31,122,111,.08));border:1px solid var(--doc-line);
  }
  .callout .big{font-family:var(--serif);font-size:1.05rem;line-height:1.5}
  .verdict-badge{
    flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;text-align:center;
    background:conic-gradient(var(--brand) calc(var(--pct)*1%), var(--paper-2) 0);position:relative;
  }
  .verdict-badge::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--paper)}
  .verdict-badge span{position:relative;z-index:1;font-family:var(--mono);font-size:1.3rem;color:var(--brand);font-weight:600}
  .verdict-badge small{position:absolute;z-index:1;bottom:20px;font-family:var(--mono);font-size:.5rem;letter-spacing:.12em;color:var(--doc-muted)}

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px}
  .stat{border:1px solid var(--doc-line);border-radius:8px;padding:16px 16px 14px;background:#fff;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac,var(--brand))}
  .stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.35rem;color:var(--doc-ink);font-weight:600}
  .stat .k{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--doc-muted);margin-top:5px}
  .stat .d{font-size:.72rem;color:var(--doc-muted);margin-top:7px;line-height:1.45}

  canvas.chart{width:100%;display:block;margin-top:18px}

  table.doc-t{width:100%;border-collapse:collapse;margin-top:18px;font-size:.84rem;background:#fff;border:1px solid var(--doc-line);border-radius:8px;overflow:hidden}
  table.doc-t th{font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:#fff;background:var(--doc-ink);text-align:right;padding:10px 12px;font-weight:500}
  table.doc-t th:first-child,table.doc-t td:first-child{text-align:left}
  table.doc-t td{padding:9px 12px;border-top:1px solid var(--doc-line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--doc-ink)}
  table.doc-t td:first-child{font-family:var(--sans);color:var(--doc-muted)}
  table.doc-t tr.hl td{background:rgba(184,134,31,.08);color:var(--brand);font-weight:600}
  table.doc-t tr.sub td{font-size:.78rem;color:var(--doc-muted)}
  table.doc-t tr.neg td.num-neg{color:var(--coral)}

  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:.72rem;color:var(--doc-muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}

  .check{display:flex;gap:13px;padding:11px 0;border-bottom:1px dashed var(--doc-line);align-items:flex-start}
  .check:last-child{border-bottom:none}
  .check .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;color:#fff;margin-top:2px}
  .check.pass .ic{background:var(--teal)} .check.warn .ic{background:var(--brand)} .check.fail .ic{background:var(--coral)}
  .check b{font-size:.88rem}
  .check p{font-size:.8rem;margin-top:2px}

  .dots{white-space:nowrap}
  .dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--paper-2);margin-left:3px;border:1px solid var(--doc-line)}
  .dots i.on{background:var(--brand);border-color:var(--brand)}

  .foot-note{margin-top:44px;padding-top:18px;border-top:1px solid var(--doc-line);font-size:.72rem;color:var(--doc-muted);line-height:1.6}
  .foot-note b{color:var(--brand)}

  /* ---------- pitch deck ---------- */
  .deck{display:flex;flex-direction:column;gap:26px}
  .slide{
    aspect-ratio:16/9;background:linear-gradient(135deg,#0B1322,#111B31 60%,#17203A);
    border:1px solid var(--line);border-radius:12px;padding:clamp(20px,4.2vw,52px);
    display:flex;flex-direction:column;position:relative;overflow:hidden;color:var(--text);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.85);
  }
  .slide .sl-tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  .slide h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.3rem,3.2vw,2.3rem);margin-top:12px;line-height:1.12;max-width:22ch}
  .slide .sl-body{margin-top:auto;padding-top:16px}
  .slide .sl-num{position:absolute;bottom:18px;right:24px;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
  .slide .sl-brand{position:absolute;bottom:18px;left:24px;font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;color:rgba(232,166,26,.55)}
  .slide ul{list-style:none;display:flex;flex-direction:column;gap:10px;max-width:56ch}
  .slide ul li{padding-left:20px;position:relative;color:var(--sl-mut,#C4CAD6);font-size:clamp(.78rem,1.6vw,.95rem)}
  .slide ul li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:2px;background:var(--sl-ac,var(--gold))}
  .slide ul li b{color:var(--sl-tx,var(--text))}
  .slide .bignum{display:flex;gap:clamp(14px,4vw,54px);flex-wrap:wrap}
  .slide .bignum div{min-width:100px}
  .slide .bignum .v{font-family:var(--mono);font-size:clamp(1.2rem,3.4vw,2.2rem);color:var(--sl-ac,var(--gold-bright))}
  .slide .bignum .k{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sl-mut,var(--muted));margin-top:4px}
  .slide canvas{width:100%;max-height:52%}
  .slide.title-slide{justify-content:center;align-items:flex-start}
  .slide.title-slide .huge{font-size:clamp(1.7rem,4.6vw,3.2rem);max-width:18ch}
  .slide .accent-teal{color:var(--sl-ac2,var(--teal))} .slide .accent-gold{color:var(--sl-ac,var(--gold-bright))}

  /* ---------- export ---------- */
  .dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
  .dl{
    border:1px solid var(--doc-line);border-radius:10px;background:#fff;padding:20px;
    display:flex;flex-direction:column;gap:8px;
  }
  .dl b{font-size:.95rem}
  .dl p{font-size:.78rem;margin:0}
  .dl button,.dl a.btn{
    margin-top:10px;cursor:pointer;align-self:flex-start;font-size:.78rem;font-weight:700;font-family:var(--sans);
    background:var(--doc-ink);color:#fff;border:none;border-radius:5px;padding:9px 18px;text-decoration:none;
  }
  .dl button:hover,.dl a.btn:hover{background:var(--brand)}
  .dl .fmt{font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;color:var(--brand)}

  @media print{
    header.nav{display:none}
    body{background:#fff}
    main{padding:0}
    .wrap{max-width:none;padding:0}
    .doc{box-shadow:none;border-radius:0}
    .sec{break-inside:avoid}
    .slide{break-after:page;border-radius:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .doc-band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>

<script>
(function(){
  'use strict';

  /* ================= project + financial engine ================= */
  var project;
  try { project = JSON.parse(localStorage.getItem('nf_active_project')); } catch (e) {}
  if (!project || !project.fin) {
    project = null; // project.html always persists a merged project; direct visits get the demo
  }

  /* Capital-bracket law applies to EVERY price on the platform, not just search:
     document tags shown here inherit the project's locked bracket factor and
     Investor Mode, exactly like the Build Hub charges in project.html. */
  var bFactor = Number((project || {}).bracketFactor) || 1;
  var invMode = localStorage.getItem('nf_investor_mode') === '1';
  function pricedAcu(base){
    var c = base * bFactor;
    if (invMode) c *= NF.COSTS.investor_multiplier;
    return Math.round(c);
  }
  var P = project || {
    id: 'demo-coldchain',
    title: 'Solar-Powered Cold-Chain Micro-Depots',
    meta: 'AGRIBUSINESS · KINSHASA, DRC · HYBRID · MAX INVESTMENT US$10,000',
    score: 87,
    sub: { 'Market Readiness': 91, 'Competitive Gap': 84, 'Prospect of Success': 87 },
    market: { 'Addressable Market': '$46M', 'Break-even': '14 mo', 'Gross Margin': '61%', 'Startup Capital': '$9,400' },
    fin: { years: ['Year 1','Year 2','Year 3'], revenue: [118000,540000,1240000], costs: [104000,342000,486000], cashflow: [14000,198000,754000] }
  };

  // ---- derived model: every number below traces back to these anchors ----
  var GM = parseFloat((P.market['Gross Margin'] || '61%')) / 100;           // gross margin
  var CAPEX = Number(String(P.market['Startup Capital'] || '$9,400').replace(/[^0-9.]/g, '')) || 9400;
  var TAM = Number(String(P.market['Addressable Market'] || '$46M').replace(/[^0-9.]/g, '')) * 1e6 || 46e6;
  var SAM = Math.round(TAM * 0.24);   // serviceable: corridors reachable within the operating region
  var SOM_Y3 = P.fin.revenue[2];      // obtainable = the year-3 revenue target itself
  var UNIT_PRICE = 2.4;               // USD per unit-transaction (crate-day equivalent)

  // 36-month revenue curve: smooth ramp within each year, scaled so monthly
  // figures sum exactly to the annual anchors.
  function monthlyRevenue(){
    var out = [];
    for (var y = 0; y < 3; y++){
      var target = P.fin.revenue[y];
      var raw = [];
      for (var m = 1; m <= 12; m++) raw.push(1 / (1 + Math.exp(-(m - 5) / 2.6)) + 0.28);
      var sum = raw.reduce(function(a,b){ return a + b; }, 0);
      var prevEnd = y === 0 ? 0 : P.fin.revenue[y-1] / 12 * 1.15;
      for (m = 0; m < 12; m++){
        var v = target * raw[m] / sum;
        if (y > 0) v = Math.max(v, prevEnd); // never dip below the prior year's exit run-rate
        out.push(v);
      }
      // re-scale the year to hit the target exactly after the floor
      var ys = out.slice(y*12).reduce(function(a,b){ return a + b; }, 0);
      for (m = y*12; m < y*12+12; m++) out[m] = out[m] * target / ys;
    }
    return out;
  }
  var REV_M = monthlyRevenue();

  // annual cost decomposition that sums exactly to the anchored totals
  function costLines(y){
    var total = P.fin.costs[y];
    var cogs = Math.min(Math.round(P.fin.revenue[y] * (1 - GM)), Math.round(total * 0.62));
    var rest = total - cogs;
    return {
      cogs: cogs,
      staffing: Math.round(rest * 0.44),
      logistics: Math.round(rest * 0.24),
      marketing: Math.round(rest * 0.17),
      admin: rest - Math.round(rest * 0.44) - Math.round(rest * 0.24) - Math.round(rest * 0.17)
    };
  }
  var COSTS = [costLines(0), costLines(1), costLines(2)];

  // cumulative cash incl. initial capex → computed break-even month
  var CUM = [], cum = -CAPEX;
  for (var m = 0; m < 36; m++){
    var y = Math.floor(m / 12);
    var costM = P.fin.costs[y] / 12;
    cum += REV_M[m] - costM;
    CUM.push(cum);
  }
  var BREAKEVEN_M = CUM.findIndex(function(v){ return v > 0; }) + 1;

  var UNITS_Y3 = Math.round(P.fin.revenue[2] / UNIT_PRICE);
  var EBITDA = P.fin.revenue.map(function(r, i){ return r - P.fin.costs[i]; });
  var ASK = Math.round((P.fin.costs[1] * 0.35 + CAPEX * 6) / 1000) * 1000; // seed ask: 35% of Y2 cost base + 6 depot build-outs

  /* ================= formatting + tiny chart library ================= */
  function fmt$(n){
    if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 2) + 'M';
    return '$' + Math.round(n).toLocaleString('en-US');
  }
  function fmtN(n){ return Math.round(n).toLocaleString('en-US'); }
  function esc(s){ var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
  var C = { brand:'#B8861F', teal:'#1F7A6F', coral:'#C4604F', violet:'#6B5CA5', blue:'#2E6FA3', ink:'#1C2233', muted:'#5D6575', line:'#E4DCC9' };

  function canvas2d(cv, h){
    var DPR = Math.min(devicePixelRatio || 1, 2);
    var w = cv.clientWidth;
    cv.style.height = h + 'px';
    cv.width = w * DPR; cv.height = h * DPR;
    var g = cv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.font = '11px ' + getComputedStyle(document.body).fontFamily;
    return { g: g, w: w, h: h };
  }

  function areaChart(cv, series, opts){
    var c = canvas2d(cv, opts.h || 230), g = c.g;
    var pad = { l: 46, r: 12, t: 14, b: 26 };
    var max = opts.max || Math.max.apply(null, series.flatMap(function(s){ return s.data; })) * 1.08;
    var min = opts.min != null ? opts.min : 0;
    var n = series[0].data.length;
    function X(i){ return pad.l + i * (c.w - pad.l - pad.r) / (n - 1); }
    function Y(v){ return pad.t + (1 - (v - min) / (max - min)) * (c.h - pad.t - pad.b); }
    g.strokeStyle = C.line; g.lineWidth = 1; g.fillStyle = C.muted; g.textAlign = 'right';
    for (var gy = 0; gy <= 4; gy++){
      var val = min + (max - min) * gy / 4, yy = Y(val);
      g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(c.w - pad.r, yy); g.stroke();
      g.fillText(fmt$(val), pad.l - 6, yy + 3);
    }
    if (min < 0){ g.strokeStyle = C.ink; g.beginPath(); g.moveTo(pad.l, Y(0)); g.lineTo(c.w - pad.r, Y(0)); g.stroke(); }
    (opts.xlabels || []).forEach(function(lb){
      g.fillStyle = C.muted; g.textAlign = 'center';
      g.fillText(lb.t, X(lb.i), c.h - 8);
      g.strokeStyle = 'rgba(28,34,51,.12)';
      g.beginPath(); g.moveTo(X(lb.i), pad.t); g.lineTo(X(lb.i), c.h - pad.b); g.stroke();
    });
    series.forEach(function(s){
      if (s.fill){
        g.beginPath(); g.moveTo(X(0), Y(s.data[0]));
        s.data.forEach(function(v, i){ g.lineTo(X(i), Y(v)); });
        g.lineTo(X(n - 1), Y(Math.max(min, 0))); g.lineTo(X(0), Y(Math.max(min, 0))); g.closePath();
        g.fillStyle = s.fill; g.fill();
      }
      g.beginPath(); g.moveTo(X(0), Y(s.data[0]));
      s.data.forEach(function(v, i){ g.lineTo(X(i), Y(v)); });
      g.strokeStyle = s.color; g.lineWidth = 2.2; g.lineJoin = 'round'; g.stroke();
    });
    if (opts.marker != null && opts.marker >= 0){
      var mx = X(opts.marker);
      g.strokeStyle = C.coral; g.setLineDash([4, 4]);
      g.beginPath(); g.moveTo(mx, pad.t); g.lineTo(mx, c.h - pad.b); g.stroke();
      g.setLineDash([]);
      g.fillStyle = C.coral; g.textAlign = 'left';
      g.fillText(opts.markerLabel || '', mx + 6, pad.t + 10);
    }
  }

  function hbars(cv, rows, opts){
    var c = canvas2d(cv, rows.length * 44 + 8), g = c.g;
    var max = Math.max.apply(null, rows.map(function(r){ return r.v; }));
    var lw = opts && opts.labelW || 150;
    rows.forEach(function(r, i){
      var y = i * 44 + 8, bw = (c.w - lw - 90) * (r.v / max);
      g.fillStyle = C.ink; g.textAlign = 'left'; g.font = '12px ' + getComputedStyle(document.body).fontFamily;
      g.fillText(r.k, 0, y + 15);
      g.fillStyle = '#EFE9DA'; g.fillRect(lw, y + 4, c.w - lw - 90, 16);
      g.fillStyle = r.c; g.fillRect(lw, y + 4, bw, 16);
      g.fillStyle = C.muted; g.textAlign = 'left';
      g.font = '11px ' + getComputedStyle(document.body).fontFamily;
      g.fillText(r.lab, lw + bw + 8, y + 16);
    });

  function donut(cv, parts, opts){
    var size = (opts && opts.size) || 210;
    var c = canvas2d(cv, size), g = c.g;
    var cx = size / 2 + 4, cy = size / 2, r = size / 2 - 10, total = parts.reduce(function(a,p){ return a + p.v; }, 0);
    var a0 = -Math.PI / 2;
    parts.forEach(function(p){
      var a1 = a0 + (p.v / total) * Math.PI * 2;
      g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, a0, a1); g.closePath();
      g.fillStyle = p.c; g.fill();
      g.strokeStyle = '#FDFBF6'; g.lineWidth = 2; g.stroke();
      a0 = a1;
    });
    g.beginPath(); g.arc(cx, cy, r * 0.58, 0, Math.PI * 2); g.fillStyle = '#FDFBF6'; g.fill();
    if (opts && opts.center){
      g.fillStyle = C.ink; g.textAlign = 'center';
      g.font = '600 17px ' + getComputedStyle(document.body).fontFamily;
      g.fillText(opts.center, cx, cy + 1);
      g.fillStyle = C.muted; g.font = '10px ' + getComputedStyle(document.body).fontFamily;
      g.fillText(opts.centerSub || '', cx, cy + 16);
    }
    // legend to the right when there is room
    var lx = cx + r + 22;
    if (lx < c.w - 120){
      g.textAlign = 'left';
      parts.forEach(function(p, i){
        var y = cy - (parts.length * 20) / 2 + i * 20 + 5;
        g.fillStyle = p.c; g.fillRect(lx, y - 9, 10, 10);
        g.fillStyle = C.ink; g.font = '11px ' + getComputedStyle(document.body).fontFamily;
        g.fillText(p.k + ' — ' + p.lab, lx + 16, y);
      });
    }
  }

  function groupedBars(cv, opts){
    var c = canvas2d(cv, opts.h || 220), g = c.g;
    var pad = { l: 46, r: 8, t: 12, b: 24 };
    var max = Math.max.apply(null, opts.series.flatMap(function(s){ return s.data; })) * 1.12;
    var n = opts.labels.length, gw = (c.w - pad.l - pad.r) / n;
    g.strokeStyle = C.line; g.fillStyle = C.muted; g.textAlign = 'right';
    for (var gy = 0; gy <= 4; gy++){
      var val = max * gy / 4, yy = pad.t + (1 - gy / 4) * (c.h - pad.t - pad.b);
      g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(c.w - pad.r, yy); g.stroke();
      g.fillText(fmt$(val), pad.l - 6, yy + 3);
    }
    opts.labels.forEach(function(lb, i){
      g.fillStyle = C.muted; g.textAlign = 'center';
      g.fillText(lb, pad.l + (i + .5) * gw, c.h - 6);
    });
    var bw = Math.min(34, gw / (opts.series.length + 1.4));
    opts.series.forEach(function(s, si){
      s.data.forEach(function(v, i){
        var x = pad.l + (i + .5) * gw + (si - opts.series.length / 2) * (bw + 4) + 2;
        var y = pad.t + (1 - v / max) * (c.h - pad.t - pad.b);
        g.fillStyle = s.color;
        g.fillRect(x, y, bw, c.h - pad.b - y);
      });
    });
  }

  render.riskmap = function(){
    // Position each project risk on a probability × impact grid. Severity from
    // the deep-dive maps to impact; probability is scored per risk category.
    var risks = (P.risks && P.risks.length ? P.risks : []).map(function(r, i){
      var impact = r.sev === 'high' ? 4 : r.sev === 'med' ? 3 : 2;
      var prob = [4, 3, 2, 3, 2][i % 5] - (r.sev === 'low' ? 1 : 0);
      return { t: r.t, p: r.p, sev: r.sev, impact: impact, prob: Math.max(1, prob), exposure: impact * Math.max(1, prob) };
    }).sort(function(a, b){ return b.exposure - a.exposure; });

    var cells = '';
    for (var im = 5; im >= 1; im--){
      for (var pr = 1; pr <= 5; pr++){
        var score = im * pr;
        var bg = score >= 15 ? 'rgba(196,96,79,.85)' : score >= 9 ? 'rgba(184,134,31,.8)' : score >= 5 ? 'rgba(184,134,31,.35)' : 'rgba(31,122,111,.45)';
        var here = risks.filter(function(r){ return r.impact === im && r.prob === pr; });
        cells += '<div style="background:' + bg + ';border-radius:4px;min-height:58px;position:relative;padding:4px">' +
          here.map(function(r){
            var idx = risks.indexOf(r) + 1;
            return '<span style="display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#1C2233;color:#fff;font-family:var(--mono);font-size:.66rem;margin:2px" title="' + esc(r.t) + '">R' + idx + '</span>';
          }).join('') + '</div>';
      }
    }
    root.innerHTML = docShell(
      sec('01', 'Exposure Matrix', '<p>Each risk is plotted by <b>probability</b> (→) and <b>impact</b> (↑). Exposure = probability × impact; anything in the red zone requires an active mitigation owner before capital deployment.</p>' +
        '<div style="display:grid;grid-template-columns:26px 1fr;gap:8px;margin-top:20px">' +
          '<div style="writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--doc-muted)">IMPACT →</div>' +
          '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">' + cells + '</div>' +
          '<div></div>' +
          '<div style="text-align:center;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--doc-muted);margin-top:4px">PROBABILITY →</div>' +
        '</div>' +
        '<div class="legend"><span><i style="background:rgba(196,96,79,.85)"></i>Critical (≥15)</span><span><i style="background:rgba(184,134,31,.8)"></i>Elevated (9–14)</span><span><i style="background:rgba(184,134,31,.35)"></i>Moderate (5–8)</span><span><i style="background:rgba(31,122,111,.45)"></i>Managed (<5)</span></div>') +

      sec('02', 'Risk Register', '<table class="doc-t"><tr><th>#</th><th style="text-align:left">Risk</th><th>Probability</th><th>Impact</th><th>Exposure</th><th style="text-align:left">Mitigation</th></tr>' +
        risks.map(function(r, i){
          var col = r.exposure >= 15 ? C.coral : r.exposure >= 9 ? C.brand : C.teal;
          return '<tr><td style="font-weight:700;color:' + col + '">R' + (i + 1) + '</td>' +
            '<td style="text-align:left;font-family:var(--sans)">' + esc(r.t) + '</td>' +
            '<td>' + r.prob + ' / 5</td><td>' + r.impact + ' / 5</td>' +
            '<td style="font-weight:700;color:' + col + '">' + r.exposure + '</td>' +
            '<td style="text-align:left;font-family:var(--sans);color:var(--doc-muted)">' + esc(r.p) + '</td></tr>';
        }).join('') + '</table>') +

      sec('03', 'Category Exposure', '<canvas class="chart" id="riskCat"></canvas>') +
      DISCLAIMER
    );
    hbars(document.getElementById('riskCat'), [
      { k: 'Operational', v: Math.max.apply(null, risks.filter(function(r){ return /supply|equipment|import|operat/i.test(r.t); }).map(function(r){ return r.exposure; }).concat([6])), c: C.coral, lab: 'primary exposure' },
      { k: 'Market / Demand', v: risks.length > 2 ? risks[2].exposure : 5, c: C.brand, lab: 'monitored' },
      { k: 'Financial', v: risks.length > 1 ? risks[1].exposure : 6, c: C.violet, lab: 'monitored' },
      { k: 'Regulatory', v: 4, c: C.blue, lab: 'managed' },
      { k: 'Competitive', v: risks.length > 3 ? risks[3].exposure : 3, c: C.teal, lab: 'managed' }

        ['Logistics & maintenance', -COSTS[0].logistics, -COSTS[1].logistics, -COSTS[2].logistics],
        ['Sales & marketing', -COSTS[0].marketing, -COSTS[1].marketing, -COSTS[2].marketing],
        ['Admin & compliance', -COSTS[0].admin, -COSTS[1].admin, -COSTS[2].admin],
        ['EBITDA', EBITDA[0], EBITDA[1], EBITDA[2]],
        ['EBITDA Margin', pct(EBITDA[0], 0), pct(EBITDA[1], 1), pct(EBITDA[2], 2)]
      ];
      if (window.NF_XLSX) NF_XLSX.download('pnl-summary.xlsx', [{ name: 'Profit & Loss', rows: rows }]);
      else download('pnl-summary.csv', 'text/csv', rows.map(function(r){ return r.join(','); }).join('\n'));
    });
    document.getElementById('dlJson').addEventListener('click', function(){
      download('project-data.json', 'application/json', JSON.stringify({
        project: P,
        derived: {
          grossMargin: GM, capex: CAPEX, tam: TAM, sam: SAM, somYear3: SOM_Y3,
          unitPrice: UNIT_PRICE, breakEvenMonth: BREAKEVEN_M, seedAsk: ASK,
          ebitda: EBITDA, costDecomposition: COSTS
        },
        generatedAt: new Date().toISOString(),
        generator: 'Niche Finder Venture Intelligence OS'
      }, null, 2));
    });
  };

  function stripTags(s){ return String(s).replace(/<[^>]*>/g, ''); }

  /* ================= real AI-generated content (takes precedence) =================
     project.html stores deep, niche-specific AI output at nf_doc_<projectId>_<type>.
     When present, it replaces the templated renderer with the actual content. */
  var aiDoc = null;
  try { var _st = JSON.parse(localStorage.getItem('nf_doc_' + ((P && P.id) || '') + '_' + type) || 'null'); if (_st && _st.content && _st.content.sections) aiDoc = _st.content; } catch (e) {}

  function aiBlocks(s){
    var h = '';
    if (s.body) h += String(s.body).split(/\n\n+/).map(function(p){ return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>'; }).join('');
    if (s.stats && s.stats.length){
      h += '<div class="statgrid">' + s.stats.map(function(x, i){ return stat(esc(x.value), esc(x.label), x.note ? esc(x.note) : '', [C.teal, C.brand, C.blue, C.violet, C.coral][i % 5]); }).join('') + '</div>';
    }
    if (s.callout) h += '<div class="callout"><div class="big">' + esc(s.callout) + '</div></div>';
    if (s.bullets && s.bullets.length){
      h += '<ul style="margin-top:14px;padding-left:0;list-style:none">' + s.bullets.map(function(b){ return '<li style="position:relative;padding-left:20px;margin:0 0 9px;color:var(--doc-muted);font-size:.9rem"><span style="position:absolute;left:0;top:.5em;width:9px;height:2px;background:var(--brand)"></span>' + esc(b) + '</li>'; }).join('') + '</ul>';
    }
    if (s.table && s.table.columns && s.table.columns.length){
      if (s.table.title) h += '<h3 style="font-family:var(--serif);font-weight:400;font-size:1.05rem;margin-top:22px">' + esc(s.table.title) + '</h3>';
      h += '<table class="doc-t"><tr>' + s.table.columns.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>' +
        (s.table.rows || []).map(function(row){ return '<tr>' + (row || []).map(function(cell, ci){ return '<td' + (ci === 0 ? ' style="text-align:left;font-family:var(--sans)"' : '') + '>' + esc(cell) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
    }
    return h;
  }

  function renderAIDoc(){
    var secs = (aiDoc.sections || []).map(function(s, i){ return sec(String(i + 1).padStart(2, '0'), esc(s.heading), aiBlocks(s)); }).join('');
    var verdict = aiDoc.verdict
      ? '<div class="callout" style="--pct:' + P.score + '"><div class="verdict-badge" style="--pct:' + P.score + '"><span>' + P.score + '</span><small>/100</small></div><div class="big">' + esc(aiDoc.verdict) + '</div></div>'
      : '';
    root.innerHTML = '<article class="doc"><div class="doc-band"><div class="doc-brandline"><i></i>NICHE FINDER · VENTURE INTELLIGENCE OS</div>' +
      '<h1>' + esc(aiDoc.title || (P.title + ' — ' + T.n)) + '</h1>' +
      '<div class="sub">' + esc(aiDoc.subtitle || T.sub) + '</div>' +
      '<div class="meta"><span>DOCUMENT <b>' + esc(T.tag) + '</b></span><span>GENERATED <b>' + esc(today) + '</b></span><span>CONFIDENCE <b>' + P.score + '/100</b></span><span>' + esc(P.meta) + '</span></div>' +
      '</div><div class="doc-body">' + verdict + secs + DISCLAIMER + '</div></article>';
  }

  function renderAIPitch(){
    var themeId = localStorage.getItem('nf_deck_theme') || 'midnight';
    var TH = DECK_THEMES.find(function(t){ return t.id === themeId; }) || DECK_THEMES[0];
    var sstyle = 'background:' + TH.bg + ';color:' + TH.tx + ';border-color:' + TH.border;
    var picker = '<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:24px">' +
      '<div style="font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase">Deck Template — choose from 10 designs</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">' +
      DECK_THEMES.map(function(t){ var on = t.id === TH.id; return '<button class="theme-pick" data-theme="' + t.id + '" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:6px;font-family:var(--sans);font-size:.74rem;font-weight:600;background:' + (on ? 'rgba(232,166,26,.14)' : 'none') + ';border:1px solid ' + (on ? 'var(--gold)' : 'var(--line-soft)') + ';color:var(--text)"><span style="width:20px;height:14px;border-radius:3px;background:' + t.bg + ';border:1px solid rgba(255,255,255,.2);display:inline-block"></span><span style="width:8px;height:8px;border-radius:50%;background:' + t.ac + ';display:inline-block"></span>' + t.n + '</button>'; }).join('') + '</div></div>';
    var n = Math.min((aiDoc.sections || []).length, 12);
    var slides = (aiDoc.sections || []).slice(0, 12).map(function(s, i){
      var body = '';
      if (s.stats && s.stats.length){ body += '<div class="bignum">' + s.stats.slice(0, 4).map(function(x){ return '<div><div class="v">' + esc(x.value) + '</div><div class="k">' + esc(x.label) + '</div></div>'; }).join('') + '</div>'; }
      if (s.bullets && s.bullets.length){ body += '<ul>' + s.bullets.slice(0, 6).map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>'; }
      else if (!s.stats || !s.stats.length){ body += '<ul>' + String(s.body || '').split(/\n\n+/).slice(0, 4).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>'; }
      var head = i === 0 ? (aiDoc.title || P.title) : (s.callout || s.heading);
      return '<section class="slide' + (i === 0 ? ' title-slide' : '') + '" style="' + sstyle + '"><span class="sl-tag" style="color:' + TH.ac + '">' + esc((s.heading || '').toUpperCase()) + '</span>' +
        '<h2 class="' + (i === 0 ? 'huge' : '') + '" style="font-family:' + TH.font + ';color:' + TH.tx + '">' + esc(head) + '</h2>' +
        '<div class="sl-body" style="--sl-tx:' + TH.tx + ';--sl-mut:' + TH.mut + ';--sl-ac:' + TH.ac + ';--sl-ac2:' + TH.ac2 + '">' + body + '</div>' +
        '<span class="sl-brand" style="color:' + TH.ac + '">NICHE FINDER · VENTURE OS</span><span class="sl-num" style="color:' + TH.mut + '">' + String(i + 1).padStart(2, '0') + ' / ' + n + '</span></section>';
    }).join('');
    root.innerHTML = picker + '<div class="deck">' + slides + '</div>';
    document.querySelectorAll('.theme-pick').forEach(function(b){ b.addEventListener('click', function(){ localStorage.setItem('nf_deck_theme', b.dataset.theme); renderAIPitch(); scrollTo({ top: 0 }); }); });
  }

  function applyAndRender(){
    if (aiDoc){
      if (type === 'pitch') render.pitch = renderAIPitch;
      else if (type !== 'export') render[type] = renderAIDoc;
    }
    render[type]();
  }

  // If the AI content isn't in this browser (cache cleared / new device / private
  // window), restore it from the account's server-side document store.
  var base = (window.NF_GATEWAY_URL || '').replace(/\/$/, '');
  if (aiDoc || type === 'export' || !base || !window.NF_WALLET_USER) {
    applyAndRender();
  } else {
    root.innerHTML = '<div style="padding:80px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.8rem;letter-spacing:.1em">RESTORING DOCUMENT…</div>';
    fetch(base + '/v1/document?user=' + encodeURIComponent(window.NF_WALLET_USER) + '&project=' + encodeURIComponent((P && P.id) || '') + '&type=' + encodeURIComponent(type))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (d && d.content && d.content.sections) {
          aiDoc = d.content;
          try { localStorage.setItem('nf_doc_' + ((P && P.id) || '') + '_' + type, JSON.stringify({ content: aiDoc, ts: d.ts || Date.now(), version: d.version || 1 })); } catch (e) {}
        }
      })
      .catch(function(){})
      .then(function(){ applyAndRender(); });
  }
  addEventListener('resize', function(){ render[type](); });
})();
</script>
<script src="nf-consent.js" defer></script>
</body>
</html>
