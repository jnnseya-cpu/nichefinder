<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Finder — Admin Console</title>
<meta name="theme-color" content="#070B14">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="robots" content="noindex">
<style>
  :root{--ink:#070B14;--ink-2:#0A1120;--panel:#0E1626;--panel-2:#121C30;--line:rgba(232,166,26,.18);--line-soft:rgba(139,147,165,.16);--text:#EAE5D9;--muted:#8B93A5;--gold:#E8A61A;--gold-bright:#FFC53D;--teal:#3FA79B;--red:#C4604F;--serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;line-height:1.55;font-size:15px}
  a{color:var(--gold);text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:26px clamp(16px,3vw,34px)}
  .topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:16px;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:28px;height:28px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center}
  .brand-mark i{width:7px;height:7px;border-radius:50%;background:var(--gold);display:block}
  .brand b{font-family:var(--serif);font-size:1.05rem;font-weight:500}.brand em{font-style:normal;color:var(--gold)}
  .kicker{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.8}
  .card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,30px)}
  .login{max-width:400px;margin:8vh auto 0}
  h1{font-family:var(--serif);font-weight:500;font-size:1.4rem;margin-bottom:4px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
  label{display:block;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
  .field{position:relative}
  input,select{width:100%;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:10px;color:var(--text);font-size:1rem;padding:11px 13px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,166,26,.14)}
  .field .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;line-height:0}
  button.primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#241a02;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-size:.95rem}
  button.primary:disabled{opacity:.6;cursor:default}
  button.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 14px;cursor:pointer;font-size:.85rem}
  button.ghost:hover{color:var(--text)}
  .full{width:100%;margin-top:18px}
  .msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:.88rem;display:none}
  .msg.err{display:block;background:rgba(196,96,79,.12);border:1px solid rgba(196,96,79,.4);color:#f0b6ab}
  .msg.ok{display:block;background:rgba(63,167,155,.12);border:1px solid rgba(63,167,155,.4);color:#a7ded6}
  .hide{display:none!important}
  .grid{display:grid;gap:20px}
  @media(min-width:820px){.grid{grid-template-columns:1fr 1.4fr}}
  .grant-row{display:grid;grid-template-columns:1fr 130px;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
  td.uid{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
  .bal{font-variant-numeric:tabular-nums}
  .pill{font-size:.68rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line-soft);color:var(--muted)}
  .pill.admin{color:var(--gold);border-color:var(--gold)}
  .tblwrap{overflow-x:auto;margin-top:14px}
  .mini{background:none;border:1px solid var(--line-soft);color:var(--gold);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:.78rem}
  .mini:hover{border-color:var(--gold)}
  .who{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><span class="brand-mark"><i></i></span><b>Niche <em>Finder</em></b><span class="kicker" style="margin-left:8px">Admin</span></div>
      <div id="whoami" class="hide"><span class="who" data-admin-email></span> · <button class="ghost" id="signout">Sign out</button></div>
    </div>

    <!-- LOGIN -->
    <section id="login" class="card login">
      <h1>Admin sign in</h1>
      <p class="sub">Operators only. Use your admin account.</p>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <div class="field"><input id="email" type="email" autocomplete="username" required></div>
        <label for="pass">Password</label>
        <div class="field"><input id="pass" type="password" autocomplete="current-password" required><button type="button" class="eye" data-eye="pass" aria-label="Show password">👁</button></div>
        <button type="submit" class="primary full" id="login-btn">Sign in</button>
      </form>
      <div class="msg" id="login-msg"></div>
    </section>

    <!-- CONSOLE -->
    <section id="console" class="hide">
      <div class="grid">
        <div class="card">
          <h1 style="font-size:1.15rem">Grant ACUs</h1>
          <p class="sub">Comp usable ACUs to any user. Enter their email or <code>op_…</code> id.</p>
          <form id="grant-form" novalidate>
            <label for="g-user">User (email or id)</label>
            <input id="g-user" type="text" placeholder="jane@example.com" required>
            <label for="g-amount">Amount (ACU)</label>
            <div class="grant-row">
              <input id="g-amount" type="number" min="1" step="1" placeholder="500" required>
              <button type="submit" class="primary" id="grant-btn">Grant</button>
            </div>
            <label for="g-reason">Reason (optional)</label>
            <input id="g-reason" type="text" placeholder="launch comp">
          </form>
          <div class="msg" id="grant-msg"></div>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h1 style="font-size:1.15rem">Users</h1>
            <button class="ghost" id="refresh">Refresh</button>
          </div>
          <p class="sub" id="users-count">Loading…</p>
          <div class="tblwrap">
            <table>
              <thead><tr><th>Email</th><th>Role</th><th>Paid</th><th>Free</th><th></th></tr></thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="nf-config.js"></script>
  <script>
  (function () {
    'use strict';
    var base = (window.NF_GATEWAY_URL || '').replace(/\/$/, '');
    var KEY = 'nf_admin_session';
    var session = null;
    try { session = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) {}

    var el = function (id) { return document.getElementById(id); };
    function setMsg(node, t, k) { node.textContent = t || ''; node.className = 'msg' + (k ? ' ' + k : ''); }
    function authHeaders() { return { 'content-type': 'application/json', authorization: 'Bearer ' + (session && session.token) }; }

    document.querySelectorAll('[data-eye]').forEach(function (b) {
      b.addEventListener('click', function () {
        var inp = el(b.getAttribute('data-eye'));
        inp.type = inp.type === 'text' ? 'password' : 'text';
        b.style.color = inp.type === 'text' ? 'var(--gold)' : '';
      });
    });

    function showConsole() {
      el('login').classList.add('hide');
      el('console').classList.remove('hide');
      el('whoami').classList.remove('hide');
      document.querySelectorAll('[data-admin-email]').forEach(function (n) { n.textContent = session.user.email; });
      loadUsers();
    }
    function showLogin() {
      sessionStorage.removeItem(KEY); session = null;
      el('console').classList.add('hide'); el('whoami').classList.add('hide');
      el('login').classList.remove('hide');
    }

    // LOGIN
    el('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = el('login-btn'); btn.disabled = true; btn.textContent = 'Signing in…'; setMsg(el('login-msg'), '', '');
      fetch(base + '/v1/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: el('email').value.trim(), password: el('pass').value }) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          btn.disabled = false; btn.textContent = 'Sign in';
          if (!res.ok) { setMsg(el('login-msg'), (res.data && (res.data.message || res.data.error)) || 'Sign-in failed.', 'err'); return; }
          if (res.data.user.role !== 'admin') { setMsg(el('login-msg'), 'This account is not an administrator.', 'err'); return; }
          session = res.data; sessionStorage.setItem(KEY, JSON.stringify(session)); showConsole();
        }).catch(function () { btn.disabled = false; btn.textContent = 'Sign in'; setMsg(el('login-msg'), 'Network error.', 'err'); });
    });

    el('signout').addEventListener('click', showLogin);

    // USERS
    function fmt(n) { return (n || 0).toLocaleString('en-US'); }
    function loadUsers() {
      el('users-count').textContent = 'Loading…';
      fetch(base + '/v1/admin/users', { headers: authHeaders() })
        .then(function (r) { if (r.status === 403 || r.status === 401) { showLogin(); throw new Error('session expired'); } return r.json(); })
        .then(function (d) {
          var users = d.users || [];
          el('users-count').textContent = users.length + ' account' + (users.length === 1 ? '' : 's');
          var body = el('users-body'); body.innerHTML = '';
          users.forEach(function (u) {
            var tr = document.createElement('tr');
            tr.innerHTML =
              '<td>' + escapeHtml(u.email) + '<div class="uid" title="' + u.userId + '">' + u.userId + '</div></td>' +
              '<td><span class="pill ' + (u.role === 'admin' ? 'admin' : '') + '">' + u.role + '</span></td>' +
              '<td class="bal">' + fmt(u.wallet.paid) + '</td>' +
              '<td class="bal">' + fmt(u.wallet.free) + '</td>' +
              '<td><button class="mini" data-grant="' + u.userId + '">Grant</button></td>';
            body.appendChild(tr);
          });
          body.querySelectorAll('[data-grant]').forEach(function (b) {
            b.addEventListener('click', function () { el('g-user').value = b.getAttribute('data-grant'); el('g-amount').focus(); });
          });
        }).catch(function () {});
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
    el('refresh').addEventListener('click', loadUsers);

    // GRANT
    el('grant-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = el('grant-btn'); var amount = parseInt(el('g-amount').value, 10);
      if (!(amount > 0)) { setMsg(el('grant-msg'), 'Enter a positive amount.', 'err'); return; }
      btn.disabled = true; btn.textContent = '…'; setMsg(el('grant-msg'), '', '');
      fetch(base + '/v1/admin/grant', { method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ userId: el('g-user').value.trim(), amount: amount, reason: el('g-reason').value.trim() }) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; }); })
        .then(function (res) {
          btn.disabled = false; btn.textContent = 'Grant';
          if (res.status === 403 || res.status === 401) { showLogin(); return; }
          if (!res.ok) { setMsg(el('grant-msg'), (res.data && (res.data.message || res.data.error)) || 'Grant failed.', 'err'); return; }
          setMsg(el('grant-msg'), 'Granted ' + fmt(res.data.granted) + ' ACU — new usable balance ' + fmt(res.data.wallet.paid) + '.', 'ok');
          el('g-amount').value = ''; el('g-reason').value = '';
          loadUsers();
        }).catch(function () { btn.disabled = false; btn.textContent = 'Grant'; setMsg(el('grant-msg'), 'Network error.', 'err'); });
    });

    if (session && session.token) showConsole(); else showLogin();
  })();
  </script>
</body>
</html>
